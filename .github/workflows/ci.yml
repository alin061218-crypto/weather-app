name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Check asset versions
        run: npm run check:versions
      - name: Check evidence scripts (static-only in CI)
        run: npm run check:evidence -- --static-only
      - name: Check server syntax
        run: node --check server.js
      - name: Check whitespace
        run: git diff --check
